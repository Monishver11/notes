name: Deploy notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Quartz's created-modified-date plugin reads git history for dates,
          # so a shallow clone would give every note the same timestamp.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `prebuild` runs install-plugins, which resolves the @quartz-community
      # packages before the build.
      - run: npm ci

      - run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
